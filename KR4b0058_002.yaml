body:
  text: 樂府銅雀妓銅雀妓秋風木葉落蕭瑟管絃清望陵歌對酒向帳舞空城寂寂簷宇曠飄飄帷幔輕曲終相顧起日暮松柏聲本集二類聚三十四文苑英華二百四詩紀八十三擬輕薄篇擬輕薄篇城東美少年重身輕萬億柘彈隨珠丸白馬黃金飾長安九逵上青槐蔭道植轂擊晨已喧肩排暝不息走狗通西望牽牛亘南直相期百戲傍去來三市側象床沓繡被玉盤傳綺食倡女掩歌扇小婦開簾織相看獨隱笑見人還歛色黃鵠悲故群山枝詠新識烏飛過客盡雀聚行龍匿酌羽方厭厭此時懽未極本集二玉臺新詠五文苑英華百九十四作輕薄篇樂府詩集六十七作輕薄篇詩紀八十三又類聚三十三引億飾植息直側食七韻四十二作輕薄篇引億飾側食纖色六韻門有車馬客門有車馬客言是故鄉來故鄉有書信縱橫印撿開開書看未極行客屢相識借問故鄉人潺湲淚不息上言離別久下言望應歸寸心將夜鵲相逐向南飛本集二文苑英華百九十五樂府詩集四十作何妥詩紀八十三昭君怨昔聞別鶴弄已自軫離情今來昭君曲還悲秋草生本集二文苑英華頁二百四樂府詩集頁二十九作何妥詩紀八十三九日侍宴樂游苑為西封侯作九日侍宴樂游苑為西封侯作皇德無餘讓重規襲帝勛垂衣化比屋睠顧慎為君翾飛悅有道卉木荷平分宸襟動時豫歲序屬涼氛城霞旦晃朗槐霧曉氤氳鸞輿和八襲鳳駕啟千群羽觴懽湛露佾舞奏承雲禁林終宴晚華池物色曛疏樹翻高葉寒流聚細紋晴軒連瑞氣同惹御香芬日斜迢遞宇風起嵯峨雲運偶參侯服恩洽廁朝聞於焉藉多幸歲暮仰遊汾本集一古今歲時雜詠三十三作九日侍宴樂遊苑文苑英華百七十三詩紀八十三又類聚四作為西豐侯九日侍宴樂遊苑詩引勛君分氛氳群雲曛文九韻初學記四作九日侍宴樂遊苑詩引勛分氛氳曛文芬汾八韻登石頭城關城乃形勢地險差非一馬嶺逐紆回犬牙傍隆窣百雉極襟帶億庾兼量出至理歸無為善守竟何恤眺聽窮耳目遠近備幽悉擾擾見行人暉暉視落日連檣入迴浦飛蓋交長術天暮遠山青潮去遙沙出薄宦恧師表屬辭慚愈疾願乘觳觫牛還隱蒙籠室本集一文苑英華三百九詩紀八十三又六朝事跡類編上引出一韻望廨前水竹答崔錄事蕭蕭叢竹映澹澹平湖淨葉倒漣漪文水漾檀欒影相思不會面相望空延頸遠天去浮雲長墟斜落景幽痾與歲積賞心隨事屏鄉念一邅迴白髮生俄頃本集二詩紀八十三暮秋答朱記室游揚日色淺騷屑風音勁寒潭見底清風色極天淨寸陰坐銷鑠千里長遼迥桃李爾繁華松柏余本性故心不存此高文徒可詠本集二詩紀八十三酬范記室雲林密戶稍陰草滋階欲暗風光蕊上輕日色花中亂相思不獨懽佇立空為歎清談莫共理繁文徒可玩高唱子自輕繼音予可憚本集一詩紀八十三落日前墟望贈范廣州雲落日前墟望贈范廣州雲緣溝綠草蔓扶楥雜華舒輕烟澹柳色重霞映日餘遙遙長路遠寂寂行人疎我心懷碩德思欲命輕車高門盛遊侶誰肯進畋漁本集一詩紀八十三又類聚三十一作落日贈范岫詩引舒餘疎三韻日夕望江山贈魚司馬日夕望江山贈魚司馬湓城帶湓水湓水縈如帶日夕望高城耿耿青雲外城中多宴賞絲竹常繁會管聲已流悅弦聲復淒切歌黛慘如愁舞腰凝欲絕仲秋黃葉下長風正騷屑早鴈出雲歸故燕辭檐別晝悲在異縣夜夢還洛汭洛汭何悠悠起望西南樓的的帆向浦團團月映洲誰能一羽化輕舉逐飛浮本集一玉臺新詠五類聚三十一文苑英華二百四十七詩紀八十三答丘長史宿昔敦遠遊名分乃異路千里泝波潮一朝披雲霧從容捨密勿繾綣論襟趣披文極詆訶析理窮章句明鐘信有待巨海誰能喻奔景驟西傾遠途忽東騖黃花發岸草赤葉翻高樹漁舟乍回歸沙禽時獨赴宴年時未幾離歌倏成賦伊我念幽關夫君思贊務短翮方息飛長轡日先驅曝鰓走逸翮康時務握手異沈浮佳期安可屢本集二詩紀八十三道中贈垣司馬季珪道中贈桓垣司馬季珪晨纜雖同解晚洲阻共入猶如征鳥飛差池不可及本願申羈旅何言異翔集君渡北江時詎今南浦泣本集二夕望江橋示蕭諮議楊建康江主簿夕鳥已西度殘霞亦半消風聲動密竹水影漾長橋旅人多憂思寒江復寂寥爾情深鞏洛予念返漁樵何因適歸願分路一揚鑣本集二詩紀八十三寄江州褚諮議自與君別離四序紛迴薄分手清江上念別猶如昨追憶邊城遊奚尋平生樂俱登巃嵸嶺共坐逶迤閣清吹或忘歸繁文時間作連鑣戲淺草遊幰遵長薄五載同衣裘一朝異暌索夫君頗留滯驂騑未沃若伊家從入關終是填溝壑早秋正悽愴餘暉晚銷鑠林葉下仍飛水花披未落如何隔千里無由舉三爵因君奏采蓮為余吟別鶴本集二詩紀八十三入西塞示南府同僚露清曉風冷天曙江晃爽薄雲巖際出初月波中上黯黯連嶂陰騷騷急沫響迴楂急礙浪群飛爭戲廣伊余本羈客重暌復心賞望鄉雖一路懷歸成二想在昔愛名山自知懽獨往情游乃落魄得性隨怡養年事以蹉跎生平任浩蕩方還讓夷路誰知羡魚網本集二詩紀八十三下直出谿邊望答虞丹徒教下直出谿邊望答虞丹徒教夫君美章句席丈珍梁楚伊余忝攝官含毫亦禁阻直廬去咫尺心期得宴語休沐乃幽棲別離未幾許佇立日將暮相思忽無緒谿北映初星橋南望行炬九重不可越三爵何由舉本集二詩紀八十三贈諸遊舊弱操不能植薄伎竟無依淺智終已矣令名安可希擾擾從役倦屑屑身事微少壯輕年月遲暮惜光輝一塗今未是萬緒昨如非新知雖已樂舊愛盡暌違望鄉空引領極目淚沾衣旅客長憔悴春物自芳菲岸花臨水發江燕遶檣飛無由下征帆獨與暮潮歸本集二詩紀八十三贈族人秣陵兄弟何思澄為秣陵令吾宗昔多士文雅高縉紳小子無學術丁寧困負薪傍枝實紛亂領袖寄親姻名價齊兩許閨門比三陳風力咸通邁藝業並紛綸元方振高羽洛令初解巾自爾典名郡所在號清淳齊兒敢為俗蜀物豈隨身祿俸不妻子謳吟乃吏民孰云穢明德惟在中聖人若能遺酌我稱首當屬仁仲將本特達坎壈猶賤貧方成天下士豈伊席上珍外情或簡易內鑒甚人倫時然臨下邑摘伏信如神顧余晚脫略懷抱日湮淪游宦疲年事來往厭江濱十載猶先職一官乃任真土牛竟不進芻狗空重陳羈旅無儔匹形影自相親蕭索高秋暮砧杵鳴四鄰霏霏入窗雨漠漠暗床塵所思不可見邈若胡與秦願子加餐飯良會在何辰本集一詩紀八十三秋夕仰贈從兄寘南階蕙漸翻葉池蓮稍罷花高樹北風響空庭秋月華寸心懷是夜寂寂漏方賒撫弦乏歡娛臨觴獨歎嗟悽愴戶涼入徘徊櫩影斜無為淹戚里見就還田家本集一詩集類函二十六仰贈從兄興寧寘南家世傳儒雅貞白仰餘徽宗派已孤狹財產又貧微棲息同蝸舍出入共荊扉松筆時臨沼蒲簡得垂帷幸逢四海泰日月耀增輝相顧無羽翮何由總奮飛一朝異言宴萬里就暌違遠江飄素沫高山鬱翠微相思對淼淼相望隔巍巍死灰終不然長岑且未歸當憐此分袂脈脈淚沾衣本集二詩紀八十三贈江長史別二紀歷茲辰投分敦遊處況事兼年德宴交無爾汝中歲多乖違由來難具敘及君相藩牧伊予客梁楚出國乃參差會歸同處所以茲篤惠好可用忘羈旅重得申平生何年更暌阻籠禽恨跼促逸翮超容與餞道出郊坰把袂臨洲渚長飆落江樹秋月照沙漵遠送子應歸棹開帆欲舉離舟懽未極別至悲無語安得生羽毛從君入宛許本集二詩紀八十三送韋司馬別送別臨曲渚征人慕前侶離言雖欲繁離思終無緒憫憫分手畢蕭蕭行帆舉舉帆越中流望別上高樓予起南枝怨子結北風愁邐邐山蔽日洶洶浪隱舟隱舟邈已遠徘徊落日晚歸衢並駕奔別館空筵卷想子歛眉去知予銜淚返銜淚心依依薄暮行人稀曖曖入塘港蓬門已掩扉簾中看月影竹裏見螢飛螢飛飛不息獨愁空轉側北窗倒長簟南鄰夜聞織棄置勿復陳重陳長歎息本集二詩紀八十三南還道中送贈劉諮議別一官從府役五稔去京華遽逐春流返歸帆得望家天末靜波浪日際歛烟霞岸薺生寒葉村梅落早花遊魚上急水獨鳥赴行楂目想平陵柏心憶青門瓜曲陌背通垣長墟抵狹斜善鄰談穀稼故老述桑麻寢興從閒逸視聽絕諠譁夫君日高興為樂坐驕奢室墮傾城佩門交接幰車入塞長雲雨出國暫泥沙握手分岐路臨川何怨嗟本集二詩紀八十三與崔錄事別兼敘攜手去夏予回首言乃重行行今春遊派澨訪子猶武城暫別年逾半同歸月未盈復道中寒食彌留曠不平道術既為務懽悰苦未并及爾沈痾愈值茲秋序明石磧沿江靜沙流繞岸清川平看鳥遠水淺見魚驚逝將窮履歷方欲恣逢迎何言聚易散鄉棹爾孤征我本倦遊客心念似懸旌聞離常屑涕是別盡淒清況此忘懷地相愛猶弟兄脈脈留南浦悠悠返上京欲鑷星星鬢因君示友生本集二詩紀八十三別沈助教可憐玉匣劍復此飛鳧舄未覺愛生憎忽見雙成隻一朝別笑語萬事成疇昔道遒若波瀾人生異金石願君深自愛共念悲無益本集二詩紀八十三與沈助教同宿湓口夜別我為潯陽客戒旦乃西游君隨春水駛雞鳴亦動舟共泛湓之浦旅泊次城樓華燭已消半更人數唱籌行人從此別去去不淹留本集二詩紀八十三與蘇九德別宿昔夢顏色咫尺思言宴何況杳來期各在天一面踟躇暫舉酒倏忽不相見春草似青袍秋月如團扇三五出重雲當知我憶君萋萋若被逕懷抱不相聞本集二詩紀八十三贈韋記室黯別故人儻送別停車一水東去帆若不見試望白雲中促膝今何在銜杯誰復同水夜看初月江晚泝歸風無因生羽翰千里暫排空本集二詩紀八十三初發新林伊昔負薪暇慕義遊梁楚短翮忘連翩追飛羨容與優游沐道教漸漬淹寒暑大德本無酬輕生竊自許舟歸屬海運風積如鵬舉浮水暗舟艫合岸喧徒侶凜凜窮秋暮初寒入洲渚鐃吹響清江懸旗出長嶼危檣迥不進沓浪高難拒回首泣親賓中天望宛許帝城猶隱約家園無處所去矣方悠悠含意將誰語本集二詩紀八十三渡連圻二首此山多靈異峻岨實非恒洑流自洄糾激瀨視奔騰懸崖抱奇崛絕壁駕崚嶒硣磟上爭險岞崿下相崩百年積死樹千尺掛寒藤詭怪終不測迴泬意難登願欲書聞見聊以寄親朋本集二詩紀八十三連圻連不極極望在雲霞絕壁無走獸窮岸有盤楂糾紛上巃嵸穿豁下巖岈魚遊若擁劍猿掛似懸瓜陰岸生駮蘚伏水拂澄沙客子行行倦年光處處華石蒲生促節巖樹落高花暮潮還入浦夕鳥飛向家寓目皆鄉思何時見狹斜本集二詩紀八十三又顏氏家訓文章篇引一句類聚二十七引華花二韻下方山寒鳥樹間響落星川際浮繁霜白曉岸苦霧黑晨流鱗鱗逆去水瀰瀰急還舟望鄉行復立瞻途近更修誰能百里地縈繞千端愁本集二詩紀頁八十三入東經諸暨縣下浙江作疲身不自量溫腹無恒擬未能守封植何能固廉恥一經可人言三冬徒戲爾虛信蒼蒼色未究冥冥理得彼既宜然失之良有以常言厭四壁自覺輕千里日夕聊望遠山川空信美歸飛天際沒雲霧江邊起安邑乏主人臨邛多客子鄉鄉自風俗處處皆城市所見無故人含意終何已本集二詩紀八十三還渡五洲我行朔已晦泝水復沿流戎傷初不辨動默自相求睠言還九派迴艫出五洲蕭散烟霧晚淒清江漢秋沙汀暮寂寂蘆岸晚脩脩以此南浦夜重此北門愁方圓既齟齬貧賤豈怨尤本集二詩紀八十三又類聚二十七引洲秋修三韻春夕早泊和劉諮議落日望水旅人嗟倦遊結纜坐春洲日暮江風靜中川聞棹謳草光天際合霞影水中浮單艫時