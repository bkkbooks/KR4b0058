詠雪詩引春新塵三韻詠白鷗兼嘲別者可憐雙白鷗朝夕水上遊何言異棲息雌住雄不留孤飛出漵浦獨宿下滄洲東西從此別影響絕無由本集二玉臺新詠五作詠白鷗嘲別者類聚九十二文苑英華三百二十九並作詠白鷗詩詩紀八十四行經范僕射故宅行經范僕射故宅旅葵應蔓井荒藤已上扉寂寂空郊暮無復車馬歸瀲灩故池水蒼茫落日暉遺愛終何極行路獨沾衣本集一類聚三十四文苑英華三百七詩紀八十四王尚書瞻祖日昱昱丹旐振亭亭素蓋立金鐸讙已鳴龍輀將復入華臺日未徙荒墳路行濕已矣將何如賓馭皆灑泣本集一詩紀八十四送褚都曹送褚都曹君隨結客去我乃倦遊歸本願同棲息今成相背飛本集二詩紀八十四送司馬入五城送司馬入五城隨風飄岸葉行雨暗江流居人會應返空欲送行舟本集二作送司馬入五城詩紀八十三邊城思柳黃未吐葉水綠半含苔春色邊城動客思故鄉來本集二詩紀八十四為人妾思二首為人妾思二首魂銷形已去釵落猶依枕欲去淚無眥不看悲復甚本集二詩紀八十四機中刺繡所窗下朝妝處未憶神已傷欲忘悲不去本集二詩紀八十四為人妾怨為人妾怨燕戲還簷際花飛落枕前寸心君不見拭淚坐調絃本集二玉臺新詠十作為人妾思詩紀八十三閨怨二首閨怨二首竹葉響南窗月光照東壁誰知夜獨覺枕前雙淚滴本集二玉臺新詠頁十作秋閨怨閨閣行人斷房櫳月影斜誰能北窗下獨對後園花本集二玉臺新詠十詩紀八十四南苑南苑花門闢千扇苑戶開萬扉樓殿聞珠履竹樹隔羅衣本集二玉臺新詠十作南苑詩紀八十四苑中見美人苑中見美人羅袖風中捲玉釵林下耀團扇承落花復持掩餘笑本集二詩紀八十四詠春風詠春風可聞不可見能重復能輕鏡前飄落粉琴上響餘聲本集二玉臺新詠十類聚一初學記一文苑英華百五十六萬花谷二詩紀八十三離夜聽琴別離既有緒琴瑟反成悲美人多怨態亦復慘長眉本集二詩紀八十四相送相送客心已百念孤遊重千里江暗雨欲來浪白風初起本集二詩紀八十四答江革聯句不成答江革聯句不成日余乏文幹逢君善草札工拙既不同神氣何由拔本集二詩紀八十四又答江革又答江革棘端雖非譬至妙安可量要知同罔象然始見毫芒本集二詩紀八十四詠雜花井上發新花誰言不經染已如薄紫拂復似濃紅點狀錦無裁縫依霞有舒斂詩紀八十四聯句擬古三首聯句擬古三首聯句家本青山下好上青山上青山不可上一上一惆悵遜匣中一明鏡好鑑明鏡光明鏡不可鑑一鑑一情傷范雲少知雅琴曲好聽雅琴聲雅琴不可聽一聽一沾纓劉孝綽本集三作擬古三首詩紀八十四往晉陵聯句臨別我傷悲送歸子自適劉金不可散卜蓋何由惜遜從來重分陰未曾輕尺璧故任情一異於是望三益高爽爾自高樓寢予返東皋陌寄語落毛人非復平原客遜問舍且求田音亂無可擇勝門成好事盤紆欲何索爽本集二詩紀八十四范廣州宅聯句范廣州宅聯句洛陽城東西卻作經年別昔去雪如花今來花似雪雲濛濛夕烟起奄奄殘暉滅非君愛滿堂寧我安車轍遜本集二詩紀八十四相送聯句寸陰常可惜別至倍傷神子瞻天際水予望路中塵韋黯憫憫岐路側去去平生親一朝事千里流涕向三春遜本集二詩紀八十四二昔共入門笑今成送別悲君還舊聚處為我一嚬眉王江乘於今還促膝自此客江湄願子俱停駕看我獨解維遜本集二詩紀八十四三高軒雖駐軫餘日久無輝以我辭鄉淚沾君送別衣遜本集二詩紀八十四至大雷聯句高談會良夕滿酒對羈情閔閔風烟動蕭蕭江雨聲遜密雲窮浦暗飛電遠洲明若非今宴適詎使客愁輕劉孺遙舟似連鴈遠火若迴星江潭望如此銜卮共君傾桓季珪本集二詩紀八十四賦詠聯句弊履常決踵眉高起半額曼倩爾何為獨歎長安索遜工商既慚巧農士聊相易蝘腹有餘資洪肩方可拍江革攝職媿握蘭濫官悲執戟連章既不敏高談豈能劇孺逸翮任奮飛窘步事羈勒還鳥余能繫流言爾無惑革憂懷乃千載永歡常數刻直是悲別離非關念通塞遜日照汀沙素山影波浪黑爾限大江南余歸茂陵北孺本集二詩紀八十四臨別聯句臨別情多緒送歸涕如霰君望長安城予悲獨不見遜爾來同去國子歸方異縣懷別心獨憂手淚方濺濺孺本集二詩紀八十四增新曲相對聯句增新曲相對聯句酒闌日隱樹上客請調絃嬌人挾瑟至逶迤未肯前劉孝勝舊愛今何在新聲徒自憐有曲無人聽徙倚高樓前何澄徘徊映日照轉側被風吹徒為相思響傷春君不知劉綺月昏樓上坐含悲望別離已切空床怨復看花柳枝遜本集二詩紀八十四照水聯句插花行理鬢遷延去復歸雖憐水上影復恐濕羅衣遜臨橋看黛色映渚媚鉛暉不顧春荷動彌畏小禽飛綺本集二詩紀八十四折花聯句笑出春園裏望花聯褰纈欲以間珠鈿非為相思折遜日照爛成綺風來聚疑雪試採一枝歸願持因遠別綺本集二詩紀八十四搖扇聯句紈扇已新製蕩婦復新妝欲掩羞中笑還飄袖裏香遜在握時搖動當歌掩抑揚誰云減羅袂影日聊自障綺本集二詩紀八十四正釵聯句竹臺歸欲礙花林出未通度簪先分影轉珥忽瞻風遜雙翹耀寶鈿闐闐密復叢羞令挂纓闕整插補餘空綺本集二詩紀八十四
