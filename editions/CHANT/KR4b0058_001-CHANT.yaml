body:
  text: 賦窮烏賦嗟窮烏之小鳥意局促而馴擾聲遇物而知哀翮排空而不矯望絕侶於夕霞聽翔群於月曉既滅志於雲霄遂甘心於園沼時復搶榆決至觸案窮歸若中氣而自墮似驚弦之不飛同雉塒而共宿啄鴈稗以爭肥異海鷗之去就無青鳥之是非豈能瑞周德而丹羽感燕悲而素暉雖有知於理會終失悟於心機初學記三十又略見藝文類聚九十二與建安王謝秀才牋與建安王謝秀才牋州民泥塗何遜死罪即日被板以民充年秀才民謝聲非關右月旦名誰錄覩物託興乏澹雅之才文豈飄然之作伏惟大王殿下令聞令望邁楚逾河好德好士雲歸海赴若夫選重雄州望隆觀國必使聲高後進德繼前修民學異扣鍾辨慚炙輠將以允應貢選待問金門上第甲科既慚髣髴管窺錐畫彌畏友朋恩榮忽賁固請無涯便當妄忝魯服濫同齊吹戰荷屏營忻惶共色不任下情謹奉牋以聞為孔導辭建安王牋為孔導辭建安王牋士實塗泥美非竹箭昔逢際會忝申名質悠悠漢水獨騖輕舟雖慕義如歸而暗投多懼遂禮頻上席愛比後車感此隆遇久知輕死軒蓋出內歷念陪遊府朝升進隨事多幸賜餘論於顏色奉德音於宴和藉此增榮遂延繆價今便除名復足在寬身非木石戀同犬馬雖朝夕曳裾無違接侍而職務一離有同賓客瞻階下拜屑涕無從永言僚故載懷罔已頡頏之禽慚悲於出幕蒙茸之獸結志於首丘為衡山侯與婦書昔人遨遊洛汭會遇陽臺神仙髣髴有如今別雖帳前微笑涉想猶存而幄裏餘香從風且歇掩屏為疾引領成勞鏡想分鸞琴悲別鶴心如膏火獨夜自煎思等流波終朝不息始知萋萋萱草忘憂之言不實團團輕扇合歡之用為虛路邇人遐音塵寂絕一日三秋不足為喻聊陳往翰寧寫款懷遲枉瓊瑤慰其杼軸藝文類聚三十二七召七召假氏先生負茲勁挺狀群飛之喪侶似獨行之迷徑神忽忽而若忘意衝衝而不定監丹綠其無主聞鐘鼓以失聽至乃冬霰積庭室靡人聲春花滿野地無行者圜堵常閉曲突無煙同生芻之有束共死灰之曀然篤論公子聞而崛起雖道術之可忘亦切嗟之所恥命徒御以駱驛將有事乎巖中車煜爚而流水馬泮渙以追風乃踰汗漫入朦朧至深潭之澳溟有洞室之穹崇居隱磷而出沒望嶔岑而下上竹距石以袤通水韻松而含響地不寒而蕭瑟月無雲而曭朗於是整容投刺屣履排門揚眉就席舉袂而言曰若五秀稟其生靈六情通其愛惡憎共集於鄙老嗜同歸於美樂今足下群鳥獸以為娛處貧賤而不怍欲賓實於孤介乃貽譏乎隕穫至乃𠹍𠹍死於道邊貿貿填於溝壑削松筆以畫虎鼓鉛刀而刻鶴身既勞而不勌事何感而莫懲欲模名於帶索豈知命於泥繩何異走長衢而避影煎流水以求冰今欲導足下以衛生之秘術怡神之妙道譬愈我於沉痾若起尸於仙草寧願聞乎先生曰有為之生已逼無益之慮常勞若見明於凝滯幸求教於肓膏宮室宮室公子曰千門始搆百常洞啟激渚開渠疏山抗址延袤水陸曠望東西下臨江海上屬雲霓百丈杳冥以飛跨九層鬱律以階梯步三休而未半塗中宿而方迷雕牆曲屈以交牙網戶周流以重積既陰岑而影響亦叫嘯而迴易沙板金鋪紫柱玉磶煒煌熻赩硱磳博敞圖雲霧之蔽虧狀神仙之來往壁璫自耀珠綴常響蜉蝣動而晝喧燿耀飛而夜朗既臨下以漻泬亦憑高而泱漭聞疾雷於階枒弄奔星於帷幌亘以曲堂周以洞房北負連闥南注長廊綺疏交映鏤檻相望燕飛蓮井日照杏梁陽烏騫其將動雲鳳矯而欲翔若乃凌沼開源延石崇壤疑崑閬之鬱岪侔滄溟之瀇瀁其中則有桂宮柏寢吳臺柘館複道耿介而連雲阿閣穹窿而仰漢望虬欄之映水見丹鶴之出岸豔草妖色嘉樹珍名長生靈壽男華女貞河柳垂葉山榴發英翫奇花之春滿摘甘實於夏成此實宮苑之壯麗豈能從我而為榮先生曰多言反道辨口傷實懼貽弊於蔀家且自求乎容膝餚饌餚饌公子曰銅鉼玉井金釜桂薪六彝九鼎百果千珍熊蹯虎掌雞跖猩脣潛魚兩味立犀五肉拾卵鳳巢剖胎豹腹三臠甘口七菹愜目蒸餅十字湯官五熟海椒魯豉河鹽蜀薑劑水火而和調糅蘇蔱以芬芳脯追復而不盡犢稍割而無傷黿羹流歠蜒醬先嘗鱠溫湖之美鮒切丙穴之嘉魴落俎霞散逐刃雪揚輕同曳繭白似飛霜蔗有盈丈之名桃表兼斤之實杏積魏國之貢菱為巨野所出衡曲黃梨汶垂蒼栗隴西白柰湘南朱橘荔枝沙棠蒲萄石蜜瓜稱素腕之美棗有細腰之質並抗吻以除煩永咀牙而消疾於是三雅陳席百味開印玉璣星稀蘭英縹潤既夷志於坎壈亦忘懷於鄙吝此蓋滋旨之極珍豈從余而並進先生曰不貴媮食豈甘醇酒既深悟於腐腸豈自迷於爽口聲色聲色公子曰秦氏獨立燕姬絕世如短如長不穠不細信耳目之珍冶乃古今之佳麗妍姿艷逸淑性閒華效施朱於宋里結墮馬於梁家折纖腰以微步呈皓腕於輕紗臨池正領拂鏡看花觀堵牆以颯沓傾城國以喧譁墨欲歸而抽軫惠將返而迴車至乃鄭衛繁聲抑揚絕調足使風雲變動性靈感召擊哀響則春臺之人愴焉而雪泣起懽情則崩城之婦粲然而微笑嶰谷調鳳之管龍門獨鵠之柯綠珠絳樹宋臈韓娥青春婉娩上客經過開洞房以命賞召才人而合宴舉輕幔以徐來隔珠簾而可見床披象簟戶垂羅薦聽促柱之方遒聞度聲之始囀步想象以頓足腕蹁躚而拂面託斜視於遺簪寄含情而舉扇俄而夕鶩東返落日西懸綺霞映水蛾月生天解鴛鴦之繡被拂蛩蚷之長氈燭中帷而動爛香出帳而微煙願橫衾以自昵脫斜領於君前此乃聲色之妖蕩將不從我而流連先生曰淫聲非篤論之旨麗色乃余情所棄伐國不問仁人此言何從而至佃遊佃遊公子曰歲晚農收時閒務隙山火已燎野霜初白聊效殺於秋冬將從禽於草澤蜀地五丁齊都二子氣動山漂汗揮雨起渥洼流頳護蘭泄血躡飛影於未形奔流星於欲滅革車隱隱轂騎闐闐鼓噪喧而振地烝徒駭而聒天割玉之刀飲石之箭罝羅布其一目罟網周其三面犬號驤螭鷹名奔電暫離已合忽隱仍見赴迥趨危衝林跋援草隨足起山從眼轉跨躡谿澗電舉陵阪鳥不及飛獸不遑伏既前躪而後掎亦左排而右蹴蹠實駭而自救騰靈亂而相撲視灑血之丹地見飛毛之暗目傍窮劫剞勢極搜求文皮坐裂膬尾生抽手羈鐵頂足批銅頭象折牙而陵遽貊拉齒而夷猶擒高樓之度索走大樹之神牛鴈聞弦而跕墮猿抱木而啾啁笑楚王之雲夢恥漢帝之中流此武材之矯猛豈能從我而畋遊先生曰馳騁傷仁好殺非勇幸廣內之豐樂何禽荒之足重神仙神仙公子曰踆烏始照官槐遽而欲舒顧兔纔滿庭英紛而就落譬光影於飛浮比生靈於栖託擾擾摩肩轔轔方駕空怵迫於毀譽獨慇勤於用舍嗟向有而今無歎後榮而前謝清歌雅舞暫同於夢寐廣廈高堂俄成於幻化若夫洗精服食慕道仙遊尋玉塵於萬里守金竈於千年三尸可度九轉難傳飛騰水陸咀嚼靈玄若乃壁上真辭枕中祕要彈壓神鬼吐納靈妙既變醜以成妍亦反老而為少虬駕夭矯而出沒霓裳颯沓而容與接鵠馭於後乘追鳳簫於前侶雨散漫以霑服雲霏微而襲宇瞰芝闕以窈窕見玉臺之相拒蓋排煙而漸滅旌拖風而未舉值解佩於江濱逢弄珠於漢渚薄遊玄圃弭節太華列神童於羽帳侍玉女於仙車澗採兮危實苑拔兮迴花聽弱水之晨浪望崑山之夕霞窮北辰而比壽指中岳以為家此神仙之恍惚豈從我而蠲邪先生曰捕影之言莫測繫風之論難盡未嘗留意於死生豈復稍論於椿菌儒學儒學公子曰洙泗遺文鄒魯餘烈其道未迷其風不絕方領圓冠金口木舌談章句之遠旨構紛綸之雅說陳五禮明六詩貫穿微妙辯析毫釐既待問於重席亦覃思而下幃醞籍愷悌和樂緝熙生徒肅肅賓友師師並接衽以聞道俱援手而受辭心絕內戰事無外慾橫經者比肩擁帚者繼足醜申韓之法令陋桓文之風俗六郡湊其衣冠五陵窮其軌躅信斯文其若水實斯人之如玉若夫珠璣產於蚌蛤珪璧出於山淵未有玉不瑩而為寶人無學而稱賢蓋持身之管籥進德之舟船響如鐘而待叩明似鏡以長懸此見重於經術寧降志於吾賢先生曰誠此言之甚美比斯道之為曠恥見嘲於腐儒豈求珍於席上治化治化公子曰我大梁之啟基方邃古而無匹先天定始比殷周而餘裕揖讓受終考唐虞而不失道德有序憲章咸秩六府孔修百司盡畢搜求儒雅捃拾遺逸旰食思治雖聞之於昔談昧旦臨朝乃見之乎茲日蕩蕩薰風泱泱大典道含弘而廣被澤汪穢而傍闡採輿人之片言納匹夫之小善事在微而畢照物無幽而不顯若夫下車布德伐罪弔民風無偃稼雨不破塵覩勝殘於朞月見成俗於浹辰含群生兮如海養萬類其猶春鄉無豕食之隸野靡狼顧之民樵者目金而知恥耕夫讓畔以成仁何大庭之足競豈栗陸之能鄰璧水道庠序之風石渠啟珪璋之盛奇士輻湊而騁足異人間出而效命小大之獄無冤民翾飛之物無夭性故能睦之以九世齊之以七政坦坦恢恢巍巍赫赫政德洽於霜風教義窮於足迹望雲氣而款關候海水而重譯所謂府不輟貢史無虛帛天瑞磊砢而相尋地符氛氳而不少收六穗於征賦翫九莖於池沼三足應感而來儀一角知時而自擾映景星於初月聆鳳音於將曉若乃亭毒不疵合天地而並施陶鈞日月與造化而齊功故非言辭之可具盡筆札之所能窮懷真獨往之夫犇走而從事滅迹藏名之士顛倒而向風二漢有同於兒戲魏晉無礙於胸中言未畢先生攝衣而起曰子前所說似玉卮之無當徒費辭而難領譬由背日而視秋毫卻行而求鄢郢一聞皇王之盛則豁然神悟而理攄志無時而可卷邦有道而宜舒敢以淺智請從後車文苑英華三百五十二
