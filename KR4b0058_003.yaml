body:
  text: 附録以下二則據何遜集輯世上逸群士人間徹總賢畢池論賞詫蔣徑篤周旋二一旦辭東序千秋送北邙客簫雖有樂鄰笛遂還傷三提琴就阮籍載酒覓揚雄直荷行罩水斜柳細牽風以上三首見日本遍照金剛文鏡祕府論天調聲齊梁調詩獨留信南浦望別乃西浮以今笑為別復使夏成秋見洪邁萬首唐人絶句五言卷二五題何仲言作以下六則據何遜集校注輯團團日隱洲烏啼滿城頭分門集注杜工部詩卷十一發秦州越次公注引金粟裏搔頭黃伯思跋何水曹集後杜陵嘗引昏鴉接翅頭金粟裏搔頭等語而此集無有林間夕風生隔水魑魅嘯分門集注杜工部詩卷十一青陽峽詩注引碧溪水色闊搖艇煩舟子分門集注杜工部詩卷十園詩注引城陰度塹黑昏鴉接翅歸仇兆鱉杜詩詳注對雪詩注引欲明今古意江水日東流杜工部草堂詩箋卷二十六懷灞上遊詩注引
